# OpenSSF Scorecard: supply-chain checks on the default branch, published to scorecard.dev
# (the README badge) and uploaded as SARIF to code scanning. Adapted from the Scorecard starter
# workflow; every action is pinned to a commit SHA.
name: scorecard

on:
  # Re-run when branch protection changes, so the Branch-Protection check stays current.
  branch_protection_rule:
  schedule:
    - cron: "27 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # publish_results only works from the default branch, and Scorecard cannot read a private
    # repository with the workflow token; the job runs once the repository is public.
    if: ${{ github.event.repository.default_branch == github.ref_name && !github.event.repository.private }}
    permissions:
      # Upload the SARIF results to code scanning.
      security-events: write
      # Publish the results to scorecard.dev and get the badge.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
