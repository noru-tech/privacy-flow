# CodeQL static analysis (SAST): results go to the repository's code scanning alerts, and
# OpenSSF Scorecard's SAST check reads them. Every language here analyzes without a build
# (build-mode: none), so the job needs no toolchain.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2" # Tuesdays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # Code scanning needs GitHub Code Security on a private repository; until the repository is
    # public (or Code Security is enabled), this job is skipped rather than failing every run.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - rust
          - python
          - actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Fixtures and conformance vectors leak personal data into logs on purpose.
          config: |
            paths-ignore:
              - tests/fixtures
              - conformance/vectors
              - examples/demo
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
