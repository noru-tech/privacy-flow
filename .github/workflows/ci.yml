name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Unit, CLI, fixtures (with the Datalog oracle), conformance, principles, and the
      # determinism goldens: the same bytes on every OS, compared with the committed files.
      - run: cargo test --locked --all-features
      - name: smoke-test the binary
        run: |
          cargo run -q -- scan examples/demo -o demo.json
          cargo run -q -- validate demo.json
          cargo run -q -- check demo.json || test $? -eq 1
          cargo run -q -- scan tests/fixtures/ts/unsupported-framework -o /dev/null || test $? -eq 4
      - name: The whole fixture tree, for the cross-OS comparison
        run: |
          mkdir -p out
          cargo run -q -- --threads 1 scan tests/fixtures --walk -o out/fixtures-1.json || test $? -eq 4
          cargo run -q -- --threads 8 scan tests/fixtures --walk -o out/fixtures-8.json || test $? -eq 4
          cmp out/fixtures-1.json out/fixtures-8.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixtures-${{ matrix.os }}
          path: out/fixtures-1.json

  cross-os:
    # Principle 1: byte-identical output across platforms, compared directly.
    name: identical output on Linux and macOS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fixtures-*
      - run: cmp fixtures-ubuntu-latest/fixtures-1.json fixtures-macos-latest/fixtures-1.json

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  jcs:
    # Every JSON output is RFC 8785 bytes and every digest is over them: recompute the goldens'
    # bytes and digests with an independent JCS implementation, without any of piiflow's code.
    name: RFC 8785 cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r .github/scripts/jcs-requirements.txt
      - run: .venv/bin/python .github/scripts/jcs_crosscheck.py tests/goldens

  benchmark-scripts:
    # The M6 benchmark's sampling and statistics (benchmark/test_benchmark.py); no corpus needed.
    name: benchmark scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest benchmark/test_benchmark.py

  conformance:
    name: conformance corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked
      - name: The digest list and manifest match the files on disk
        run: python3 conformance/digests.py --check
      - name: Run the corpus through the external-runner contract
        uses: ./conformance
        with:
          verifier: target/debug/piiflow -q scan --walk -f facts
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report
          path: conformance-report.json

  conformance-broken:
    # A corpus that a broken analyser also passes proves nothing. Break one thing at a time and
    # require the corpus to fail.
    name: conformance catches ${{ matrix.break }}
    runs-on: ubuntu-latest
    env:
      # A deliberate break leaves dead code behind; it must still build.
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        break: [field-sensitivity, summaries, instances, sanitisers, stores, allocation-sites]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: python3 .github/scripts/break_engine.py ${{ matrix.break }}
      - run: cargo build --locked
      - name: The corpus must fail
        run: |
          if python3 conformance/run.py --verifier "target/debug/piiflow -q scan --walk -f facts" --report broken.json; then
            echo "::error::the corpus passed an analyser with ${{ matrix.break }} broken"
            exit 1
          fi
          python3 -c "import json; t = json.load(open('broken.json'))['totals']; assert t['fail'] + t['error'] > 0; print(t)"

  performance:
    # Catches an accidental quadratic, not a few percent: budgets in perf_budget.py.
    name: performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release
      - run: python3 .github/scripts/perf_budget.py target/release/piiflow
