# Publish privacy-flow to crates.io with Trusted Publishing: the job exchanges its GitHub
# OIDC token for a short-lived crates.io token, so no long-lived CARGO_REGISTRY_TOKEN secret exists.
#
# How it runs:
#   - Automatically: release.yml (generated by dist) calls this workflow as a custom publish job
#     (`publish-jobs = ["homebrew", "./publish-crate"]` in dist-workspace.toml) once the GitHub
#     Release is up. crates.io then sees release.yml as the calling workflow.
#   - By hand, as a fallback: Actions → publish-crate → Run workflow with the tag, or
#     `gh workflow run publish-crate.yml -f tag=vX.Y.Z`. crates.io then sees publish-crate.yml.
#
# crates.io matches the top-level workflow, so the crate has two trusted publishers
# (Settings → Trusted Publishing → GitHub, owner noru-tech, repository privacy-flow,
# no environment): one for release.yml, one for publish-crate.yml.
#
# A version that is already on crates.io is skipped, so re-running a release is safe.
name: publish-crate

on:
  workflow_call:
    inputs:
      plan:
        description: dist's release plan (JSON), passed in by release.yml
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.1.0)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: publish-crate
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.plan && fromJson(inputs.plan).announcement_tag || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: stable
      - name: The tag names the version in Cargo.toml
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "privacy-flow") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Skip a version that is already published
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -A 'noru-tech/privacy-flow publish-crate' \
            "https://crates.io/api/v1/crates/privacy-flow/$VERSION")
          if [ "$status" = 200 ]; then
            echo "privacy-flow $VERSION is already on crates.io, nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.published.outputs.skip != 'true'
        id: auth
      - if: steps.published.outputs.skip != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
