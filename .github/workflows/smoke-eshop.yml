name: smoke (eShop)

# The C# analysis against dotnet/eShop at a pinned commit: the findings and flows in
# tests/smoke/eshop.expected.json, determinism across thread counts, and bounded coverage gaps;
# and the data map's systems, datasets and edges in tests/smoke/eshop.datamap.expected.json.
# It needs the network to fetch eShop, so it is not part of `cargo test`.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/lower/**"
      - "src/facts.rs"
      - "src/facts/**"
      - "src/program.rs"
      - "src/resolve.rs"
      - "src/topology/**"
      - "src/datamap/**"
      - "catalogue/**"
      - "tests/smoke/**"
      - ".github/scripts/smoke_eshop.py"
      - ".github/workflows/smoke-eshop.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-eshop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  eshop:
    name: dotnet/eShop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release
      - name: Scan eShop and check the expectations
        run: python3 .github/scripts/smoke_eshop.py target/release/piiflow --report eshop.json
      - name: Keep the document
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eshop-flows
          path: eshop.json
          if-no-files-found: ignore
