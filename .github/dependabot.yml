version: 2
updates:
  # Keeps the SHA pins in .github/workflows current (the `# vX.Y.Z` comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Rust dependencies in Cargo.lock; minor and patch updates arrive as one grouped pull request.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
