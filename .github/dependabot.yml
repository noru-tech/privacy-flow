version: 2
updates:
  # Keeps the SHA pins in .github/workflows current (the `# vX.Y.Z` comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Rust dependencies in Cargo.lock; minor and patch updates arrive as one grouped pull request.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  # The fuzz crate has its own lockfile, and ClusterFuzzLite's base image is pinned by digest.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    groups:
      fuzz-cargo:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
