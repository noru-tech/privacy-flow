[package]
name = "privacy-flow"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Deterministic, offline static analysis of where personal data goes: logs, third-party SDKs, LLM providers and outbound HTTP. Cited file:line flow paths, SARIF, canonical JSON and Fides egress."
license = "MIT"
repository = "https://github.com/noru-tech/privacy-flow"
homepage = "https://github.com/noru-tech/privacy-flow"
documentation = "https://github.com/noru-tech/privacy-flow#readme"
readme = "README.md"
keywords = ["privacy", "gdpr", "static-analysis", "taint", "sarif"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Noru <bip@noru.tech>"]

[lib]
name = "privacy_flow"
path = "src/lib.rs"

[[bin]]
name = "piiflow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ascent = "0.8"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.3"
jsonschema = { version = "0.58", default-features = false }
rayon = "1.12"
regex = "1.12"
serde-saphyr = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
walkdir = "2.5"
