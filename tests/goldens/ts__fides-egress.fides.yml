# Fides egress declarations generated by privacy-flow 0.3.0 from an uncommitted tree.
# A fragment to merge into a Fides data map (for example .fides/datamap.yml): it carries
# egress only. Privacy declarations (data use, data subjects, legal basis) are judgements
# this tool does not make; add them where you maintain the system.
system:
  - fides_key: "storefront"
    name: "Storefront"
    # Keys starting with unresolved_ are destinations the code does not name (a host
    # computed at run time, a provider chosen by configuration). Replace each with the
    # receiving system's key, or declare the processor in .privacy-flow.yml and scan again.
    egress:
      # Anthropic via llm
      - fides_key: "anthropic"
        type: "system"
        data_categories:
          - "user.contact.email"
      # Unresolved http destination, sent from src/billing/client.ts:3
      - fides_key: "unresolved_http_billing_client"
        type: "system"
        data_categories:
          - "user.contact.email"
      # Unresolved http destination, sent from src/crm/client.ts:3
      - fides_key: "unresolved_http_crm_client"
        type: "system"
        data_categories:
          - "user.contact.phone_number"
