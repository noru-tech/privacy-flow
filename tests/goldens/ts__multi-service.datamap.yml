# A Fides data map (Fideslang 3.1.3) of this repository, written by `piiflow datamap`.
# Systems, egress and ingress come from the code; lines starting with "#:" say where.
# Keys starting with unresolved_ are destinations the code does not name: replace each with
# the receiving system's key, or declare it in .privacy-flow.yml and run again.
system:
  #: third-party processor PostHog
  - fides_key: "posthog"
    name: "PostHog"
    system_type: "Third Party"
    ingress:
      - fides_key: "shop_api"
        type: "system"
        data_categories:
          - "user.contact.email"
    privacy_declarations: []
  #: service rooted at apps/api (js.server: apps/api/package.json)
  #: reached as api (docker-compose.yml)
  - fides_key: "shop_api"
    name: "@shop/api"
    system_type: "Service"
    egress:
      #: PostHog via analytics (undeclared): packages/shared/src/index.ts:6
      - fides_key: "posthog"
        type: "system"
        data_categories:
          - "user.contact.email"
    ingress:
      - fides_key: "shop_web"
        type: "system"
        data_categories:
          - "user.contact.email"
          - "user.device.ip_address"
      #: request input to its handlers: apps/api/src/server.ts:7, apps/api/src/server.ts:8 and more
      #: also data of unknown category (request input not narrowed by a type): review
      - fides_key: "user"
        type: "user"
        data_categories:
          - "user.contact.email"
          - "user.device.ip_address"
    privacy_declarations: []
  #: service rooted at apps/web (js.server: apps/web/package.json)
  #: reached as web (docker-compose.yml)
  - fides_key: "shop_web"
    name: "@shop/web"
    system_type: "Service"
    egress:
      #: to shop_api over HTTP: apps/web/app/api/subscribe/route.ts:7
      - fides_key: "shop_api"
        type: "system"
        data_categories:
          - "user.contact.email"
          - "user.device.ip_address"
    ingress:
      #: request input to its handlers: apps/web/app/api/subscribe/route.ts:5, apps/web/app/api/subscribe/route.ts:6, apps/web/app/api/subscribe/route.ts:7 and more
      #: also data of unknown category (request input not narrowed by a type): review
      - fides_key: "user"
        type: "user"
        data_categories:
          - "user.contact.email"
          - "user.device.ip_address"
    privacy_declarations: []
