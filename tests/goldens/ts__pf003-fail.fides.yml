# Fides egress declarations generated by privacy-flow 0.2.0 from an uncommitted tree.
# A fragment to merge into a Fides data map (for example .fides/datamap.yml): it carries
# egress only. Privacy declarations (data use, data subjects, legal basis) are judgements
# this tool does not make; add them where you maintain the system.
# Set system.fides_key in .privacy-flow.yml to name this system.
system:
  - fides_key: "this_system"
    egress:
      # OpenAI (undeclared) via llm
      - fides_key: "openai"
        type: "system"
        data_categories:
          - "user.contact.email"
