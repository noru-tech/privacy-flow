# Context for the vendored classification table (vendor/classification/classification.json).
#
# The table maps a field name to a Fideslang category when the name means the same thing in
# every schema it appears in. A few of its names do not: `state` is a postal address's state in
# an `Address`, and a workflow's, a component's, a chat run's or an OAuth flow's state almost
# everywhere else. Each entry here keeps such a name to the context where the table's category
# holds: the name is classified when the object it is read from is named like one of `objects`
# (`address.state`, `billing_address["state"]`, a field of a class or type named `Address`), or
# when a name beside it (another field of the same type, another parameter of the same function)
# is one of `siblings`. Otherwise it is not classified. Names are compared as table keys
# (lowercased, every run of non-alphanumerics an `_`); `objects` are globs.
#
# A project's own `fields` in .privacy-flow.yml, and an ingested data map, still classify the
# name everywhere. The table is shared with privacy-datamap and vendored verbatim; the same
# change belongs upstream, after which an entry here can go.

version: "0.1.0"

contextual:
  - id: address-state
    description: >-
      `state` and `province` are an address's only beside other address fields or on an
      address. Elsewhere they are application state (a workflow's, a component's, a chat run's).
    names: [state, province]
    objects: ["*address*", "*addr", "*addr_*", "location", "*_location"]
    siblings:
      [city, town, locality, postal_code, postcode, post_code, zip, zip_code, zipcode, country,
       country_code, street, street_address, address_line1, address_line_1, address1, line1, county]

  # ------------------------------------------------------------------ identifiers of people
  # The table names no identifiers: an `id` is a person's only on a person's record. These are
  # pseudonymous data (GDPR Recital 26): personal data, though not identifying on their own.
  - id: person-identifiers
    description: Field and parameter names that hold the identifier of a user, customer or member.
    category: user.unique_id.pseudonymous
    names:
      [user_id, userid, customer_id, customerid, member_id, memberid, subscriber_id, account_user_id,
       stripe_customer_id, distinct_id, external_customer_id, payment_processor_user_id]

  - id: person-record-id
    description: >-
      `id`, `uid` and `uuid` are a person's identifier when read from a person's record
      (`user.id`, `customer["id"]`, the `id` of a class or type named `User`), and an identifier
      of something else everywhere else.
    category: user.unique_id.pseudonymous
    names: [id, uid, uuid]
    objects:
      ["user", "users", "*_user", "user_*", "customer", "customers", "*_customer", "customer_*",
       "member", "*_member", "member_*", "subscriber", "person", "people", "author", "owner",
       "creator", "recipient", "*_recipient", "account_holder", "patient", "student", "employee"]

# ------------------------------------------------------------------ identifiers of things
# An identifier named for a thing is not personal data: `item_id`, `catalog_item_id`, `BrandIds`,
# `item_type_id`. The name must be entity words only, then a suffix: `user_type_id` and
# `blood_type_id` keep whatever classification they have, since a lookup ID beside a person can
# encode an attribute of that person. Request input under such a name is not a source (a route
# parameter `ItemId`), and the name is never classified. A project's own `fields` still apply.
# Orders, accounts, teams and tenants are left out: they belong to people often enough that an
# unclassified one stays uncertain, for review (ADR 0021).
entity_identifiers:
  - id: entity-identifiers
    description: Identifiers of catalogue items, products, brands, categories and order lines.
    entities:
      [item, items, product, products, brand, catalog, catalogue, category, type, kind, sku,
       variant, price, currency, warehouse, inventory, stock, order_line, order_item, line_item,
       basket_item, cart_item]
    suffixes: [id, ids, uuid, guid, sku]
