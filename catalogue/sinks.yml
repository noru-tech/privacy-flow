  - id: py.logger-by-name
    language: python
    class: log
    description: >-
      Heuristic. A method call on a receiver named like a logger whose origin the analysis
      cannot see. Findings from it are marked `heuristic`.
    receivers: [logger, log, LOGGER, _logger, _log]
    methods: [debug, info, warning, warn, error, exception, critical, fatal, log]

  # ------------------------------------------------------------------ error tracking
  - id: py.sentry
