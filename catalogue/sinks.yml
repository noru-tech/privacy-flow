  - id: py.django.mail
    language: python
    class: messaging
    description: >-
      Django's email API; the receiving provider is whatever the email backend is configured to
      use. A message object sends what it was built with.
    calls: ["django.core.mail.{send_mail,send_mass_mail,mail_admins,mail_managers}", "django.core.mail.{EmailMessage,EmailMultiAlternatives}{,()}.send"]
    receiver: true

  - id: py.smtplib
