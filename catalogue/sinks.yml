    calls: ["emails.{Message,html,message.Message,message.html}{,()}.send"]
    receiver: true

  - id: py.apprise
    language: python
    class: messaging
    description: >-
      Apprise; the notification services (and their credentials and recipients) are the URLs
      added to the instance, so no processor is named and the instance is sent with the message.
    calls: ["apprise.Apprise{,()}.{notify,async_notify}"]
    receiver: true

  - id: py.resend
    language: python
    class: messaging
    processor: Resend
    calls: ["resend.{Emails,Batch}.send"]

  - id: py.mailjet
    language: python
    class: messaging
    processor: Mailjet
    calls: ["mailjet_rest.Client{,()}.send.create"]

  - id: py.brevo
