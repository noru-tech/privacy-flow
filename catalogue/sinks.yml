  - id: js.mixpanel
    language: javascript
    class: analytics
    processor: Mixpanel
    calls:
      - "{mixpanel,mixpanel-browser}:**.{track,identify,alias,register,register_once,track_with_groups}"
      - "{mixpanel,mixpanel-browser}:**.people.{set,set_once,append,union,increment}"

  - id: js.posthog
