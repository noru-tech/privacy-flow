      The standard library's SMTP client; the receiving server is configured at run time, so no
      processor is named.
    calls: ["smtplib.{SMTP,SMTP_SSL,LMTP}{,()}.{sendmail,send_message}"]

  - id: py.flask-mail
    language: python
    class: messaging
    description: Flask-Mail; the SMTP server is configured at run time. A message object sends what it was built with.
    calls: ["flask_mail.{Mail,Connection}{,()}.{send,send_message}", "flask_mail.Mail{,()}.connect{,()}.{send,send_message}", "flask_mail.Message{,()}.send"]
    receiver: true

