# Sinks: where personal data leaves a value and goes somewhere that matters.
#
# Each entry matches calls (or property writes) by API path. An API path names what a value is,
# from its import: `openai:().chat.completions.create` is the `create` method reached from an
# instance of the `openai` module's default export; Python paths are dotted
# (`logging.getLogger().info`); JavaScript globals have no module (`console.log`).
# In patterns `*` matches within one segment, `**` matches any run of segments and `{a,b}`
# alternates. `processor` names the vendor that receives the data, where there is one.
#
# `args` selects the arguments that carry data out (default: all, including keyword arguments).
# `host` says where an outbound HTTP call's URL is: a positional `arg`, a Python `keyword`, or
# a `field` of an options object. With `base_url: true` a relative URL is resolved against a
# client's configured base URL, so it is not treated as the application's own origin.
#
# Adding an SDK is a pull request to this file: see CONTRIBUTING.md.

version: "0.1.0"

sinks:
  # ------------------------------------------------------------------ JavaScript / TypeScript: logs
  - id: js.console
    language: javascript
    class: log
    description: The console (stdout/stderr), which log shippers usually collect.
    calls: ["console.{log,info,warn,error,debug,trace,dir,table,group,groupCollapsed,assert}"]

  - id: js.pino
    language: javascript
    class: log
    calls: ["pino:**.{trace,debug,info,warn,error,fatal}"]

  - id: js.winston
    language: javascript
    class: log
    calls: ["winston:**.{log,info,warn,error,debug,verbose,silly,http}"]

  - id: js.bunyan
    language: javascript
    class: log
    calls: ["bunyan:**.{trace,debug,info,warn,error,fatal}"]

  - id: js.loglevel
    language: javascript
    class: log
    calls: ["loglevel:**.{trace,debug,info,warn,error}"]

  - id: js.nestjs.logger
    language: javascript
    class: log
    calls: ["@nestjs/common:Logger**.{log,error,warn,debug,verbose,fatal}"]

  - id: js.logger-by-name
    language: javascript
    class: log
    description: >-
      Heuristic. A method call on a receiver named like a logger whose origin the analysis
      cannot see (an injected logger). Findings from it are marked `heuristic`.
    receivers: [logger, log, LOGGER, _logger, appLogger]
    methods: [log, info, warn, error, debug, trace, fatal, verbose]

  # ------------------------------------------------------------------ error tracking
  - id: js.sentry
    language: javascript
    class: error_tracking
    processor: Sentry
    calls:
      - "@sentry/*:{setUser,setContext,setExtra,setExtras,setTag,setTags,addBreadcrumb,captureException,captureMessage,captureEvent}"
      - "@sentry/*:**.{setUser,setContext,setExtra,setExtras,setTag,setTags,addBreadcrumb,captureException,captureMessage,captureEvent}"

  # ------------------------------------------------------------------ product analytics
  - id: js.segment
    language: javascript
