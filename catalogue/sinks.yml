  - id: py.mailchimp-transactional
    language: python
    class: messaging
    processor: Mailchimp Transactional
    calls: ["mailchimp_transactional.Client{,()}.messages.{send,send_template}"]

  - id: py.vonage
    language: python
    class: messaging
    processor: Vonage
    calls: ["vonage.{Client,Vonage}{,()}.{sms,messages}.{send,send_message}"]

  - id: py.telegram
    language: python
    class: messaging
    processor: Telegram
    calls: ["telegram.Bot{,()}.{send_message,send_photo,send_document,send_contact,send_location}"]

  - id: py.boto3-sns
    language: python
    class: messaging
    processor: Amazon SNS
    description: Amazon SNS (`publish` on a boto3 client, which is SNS's call for SMS, push and topics).
    calls: ["boto3.client{,()}.{publish,publish_batch}"]

  - id: py.firebase-messaging
