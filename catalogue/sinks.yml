    calls: ["@langchain/google-genai:**.{invoke,stream,batch,call,predict,generate,embedQuery,embedDocuments}"]

  - id: js.langchain.mistral
    language: javascript
    class: llm
    processor: Mistral
    calls: ["@langchain/mistralai:**.{invoke,stream,batch,call,predict,generate,embedQuery,embedDocuments}"]

  - id: js.vercel-ai
    language: javascript
