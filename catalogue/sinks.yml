    calls: ["fetch", "{node-fetch,cross-fetch,isomorphic-fetch}:", "undici:{fetch,request}"]
    host: { arg: 0 }

  - id: js.axios
    language: javascript
    class: http
    calls: ["axios:", "axios:{get,post,put,patch,delete,request,head,options,postForm,putForm}"]
    host: { arg: 0, field: url }

  - id: js.axios.instance
    language: javascript
    class: http
    description: An axios instance; its base URL is set where the instance is created.
    calls: ["axios:create()", "axios:{create(),AxiosInstance}.{get,post,put,patch,delete,request,head,options,postForm,putForm}"]
    host: { arg: 0, field: url, base_url: true }

  - id: js.got-ky
    language: javascript
    class: http
    calls: ["{got,ky}:", "{got,ky}:{get,post,put,patch,delete,head}"]
    host: { arg: 0 }

