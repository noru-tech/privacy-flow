  - id: js.langchain.anthropic
    language: javascript
    class: llm
    processor: Anthropic
    calls: ["@langchain/anthropic:**.{invoke,stream,batch,call,predict,generate}"]

  - id: js.langchain.google
    language: javascript
    class: llm
