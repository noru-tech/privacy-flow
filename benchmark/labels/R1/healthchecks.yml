    citation: "hc/integrations/signal/transport.py:101"
    note: "Pydantic returns a PhoneConf retaining value. Signal.notify reads channel.phone.value at line179, passes it as recipient, and failure handling logs that recipient at line101; Call also sends it in Twilio POST data."
  Gb2051b0a72:
    hides_flow: "no"
    citation:
    note: "Fido2Server verifies the assertion locally against stored credentials. The wrapper returns only a boolean and catches validation errors; no logging or third-party transmission is established."
  Ga55ed16e10:
