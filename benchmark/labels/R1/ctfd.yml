# Labels for ctfd, imported from the labelling app. See benchmark/PROTOCOL.md §3.
items:
  F53e74a8b69:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "User.name is passed into the logging wrapper, merged into props and interpolated into the already-solved submission log."
  F0032111aae:
    verdict: "fp_path"
    category_ok: "no"
    citation: "CTFd/auth.py:104"
    note: "The rendered confirmation-email message is produced after the log and does not flow backward. The log uses user.name, not that email-bearing response string; the email is not public content."
  F95c14a86d9:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The submitted form contains user-authored challenge submission content. The too-fast log formats that submission with the user name via the logging wrapper; the whole request_data source therefore reaches the log."
  Fb10ce1a94d:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/utils/updates/__init__.py:52"
    note: "Users.query.count returns an aggregate count, not password field values. The final resource.get is additionally a dictionary lookup on the version response, not an HTTP sink."
  Ff52bb2ffdf:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/utils/updates/__init__.py:50"
    note: "Challenges.query.count emits a total count and does not read or serialize the ratings relationship or review content. Ratings do not become version-check parameters."
  F886fee9d53:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The participant name passes as a keyword argument to the logging wrapper and is interpolated into the too-fast submission log."
  F485c2b45b8:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "Existing user name is formatted into the failed-password login message and sent to logger.info."
  Fb2b8574bc2:
    verdict: "tp"
    category_ok: "no"
    citation: "CTFd/auth.py:486"
    note: "The shown backward branch path is invalid, but the same stored user.name is directly read and logged on successful login at486. It is an account/display name, not public user content."
  Ff47b580425:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/utils/updates/__init__.py:53"
    note: "Teams.query.count returns only a count and does not read or transmit the email column. The version-check payload contains the aggregate rather than team email addresses."
  Fce902e2dda:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "User.name is passed to log, inserted into the reset-success message and recorded by logger.info."
  Fba5e838dff:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/utils/updates/__init__.py:52"
    note: "Counting Users does not read their language values. The final resource.get is also a dictionary read rather than an HTTP call; no language data reaches it."
  F01f818e44b:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "Request remote_addr is returned by get_ip and inserted into logging props; templates containing {ip}, such as login logs, emit the client IP."
  Fbba516b125:
    verdict: "tp"
    category_ok: "no"
    citation: "CTFd/utils/email/providers/mailgun.py:26"
    note: "When the config key is mailfrom_addr, its email address is formatted as From and posted to Mailgun. The applicable category is contact email, not public content."
  F1d65cfbc89:
    verdict: "fp_path"
    category_ok: "no"
    citation: "CTFd/utils/updates/__init__.py:73"
    note: "The specified sink is a dictionary read of the server’s next-check timestamp, not an HTTP call. The source is also an aggregate user count, not public personal content, and it is not reflected as that timestamp."
  Fa292c9d451:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/api/v1/challenges.py:860"
    note: "Loading a User object does not transfer its language field into account_id, user.name or challenge_id. The too-fast log contains those selected fields and submission, not user.language."
  F9c323cc019:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "User.name passes into the logging wrapper and is formatted into the partial-credit submission message."
  F9a3a75514c:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/auth.py:500"
    note: "The log reads the separate User.name field, not User.email. Merely sharing a model does not propagate the email column to name."
  Fd380aa2b5d:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The client remote_addr is returned by get_ip and interpolated into any log template containing {ip}, including authentication logs."
  F28096e54b5:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/exports/__init__.py:106"
    note: "set_import_status receives strings containing backup member filenames at304, before checking the db/ prefix. Remaining archive members include uploaded filenames, which can contain personal user-authored names, and are printed here."
  F5b0334ebb4:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/auth.py:573"
    note: "OAuth authorization code from the request is inserted into the token-exchange POST body; it is credential-bearing personal data."
  F7baa37368c:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/api/v1/challenges.py:886"
    note: "account_id and challenge_id are separate filter arguments. The account ID does not become challenge_id or user.name, and the partial-submission log template does not interpolate the account ID."
  F78fcf563b7:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/utils/updates/__init__.py:52"
    note: "Users.query.count does not access or emit account_id properties. Only the total number of users is sent to the version service."
  F7ca754c02f:
    verdict: "fp_path"
    category_ok: "no"
    citation: "CTFd/auth.py:179"
    note: "The earlier reset-success log reads user.name, not user.email used in the separate forgot-password branch. The email does not flow backward or become a name, and is contact data rather than public content."
  F06faa956f6:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/utils/updates/__init__.py:49"
    note: "Database dialect name is a software/configuration type such as mysql or postgres, not personal data. It is sent, but the user category is inapplicable."
  F0c72c0af57:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "When login input is a username, the name-filter lookup returns that matching user and the same name value is logged on successful authentication."
  F577ddc3ef6:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/auth.py:179"
    note: "The reset-success log selects the independent name field. Sending email in the later forgot-password branch does not copy User.email into User.name or this log."
  F39be92769f:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/auth.py:579"
    note: "On this path the config key is oauth_api_endpoint, a service endpoint URL. That configuration is not a person identifier or credential; the separately supplied OAuth Authorization header is a different source."
  F7346fc45ad:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The registration email is passed to the logging wrapper and interpolated into the unconfirmed-registration message."
  F0b4a536038:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/utils/config/__init__.py:12"
    note: "This config value is the competition name, used with a timestamp for the export basename. It identifies the event rather than a person, and no personal backup contents are printed."
  F88276d5e71:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/auth.py:573"
    note: "The shown endpoint-config value is nonpersonal, but an equivalent path from the same config-value source reads oauth_client_secret at auth.py:563-565 and places it in this token-exchange POST body."
  F770a46096a:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "get_ip selects a client address from the request route, returns it, and the logging wrapper includes it in templates using {ip}."
  F8d35e51469:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The selected untrusted client IP from access_route/remote_addr is preserved into props.ip and formatted into authentication logs."
  F0bda6b13f1:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The JSON request contains user-authored submission content; log at860 reads request_data.submission and formats it into logger.info, an equivalent direct field path from this source object."
  F6c8632dd8d:
    verdict: "tp"
    category_ok: "no"
    citation: "CTFd/cli/__init__.py:37"
    note: "The CLI accepts an arbitrary config key and prints its stored value. Keys such as mailfrom_addr or oauth_client_secret therefore print contact email/credentials; those are not public content."
  F63fab98302:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/auth.py:579"
    note: "The configuration value used here is the OAuth API endpoint URL, a service location rather than public personal content. The request’s access token comes from the separate OAuth response."
  G2759212b6a:
    hides_flow: "no"
    citation:
    note: "csv.writer writes rows into an in-memory StringIO buffer, converted to BytesIO and returned for the application’s own CSV download response. It does not send to a third party or log the rows."
  G0687171104:
    hides_flow: "yes"
    citation: "CTFd/utils/uploads/uploaders.py:228"
    note: "With the S3 uploader configured, delete forwards the stored upload filename as the S3 object Key. Uploaded names can contain personal user-authored filenames, which reach the storage API."
  G9aecfc4d2b:
    hides_flow: "no"
    citation:
    note: "Python all reduces prerequisite truthiness to a boolean for validation. It does not serialize, log or transmit the source values; the validation message is fixed."
  Gbc8cb3fa19:
    hides_flow: "yes"
    citation: "CTFd/utils/uploads/uploaders.py:271"
    note: "S3Uploader.open passes the configured uploaded logo filename to s3.download_file as its object key. The upload-derived filename is preserved and can contain a personal name; the filesystem backend stays local."
  Gf2386e0f55:
    hides_flow: "no"
    citation:
    note: "UserSchema.load validates/deserializes the CSV row into a local User model. The following operations persist it in the database and return validation errors; no external notification or log is present on this import path."
  G9fc19ffc4f:
    hides_flow: "no"
    citation:
    note: "cache.add writes a lock key to the application cache/database. It returns acquisition success, not the account ID, and this local coordination write is excluded from sinks."
  Ga0671d3712:
    hides_flow: "yes"
    citation: "CTFd/utils/email/providers/smtp.py:63"
    note: "smtplib.send_message serializes the email and transmits sender/recipient addresses and body through the SMTP connection. Both branches are outbound email delivery."
  Gb8345982a1:
    hides_flow: "no"
    citation:
    note: "FilesystemUploader returns send_file; S3Uploader locally generates a presigned URL and returns a redirect. These are the application’s own download responses; generate_presigned_url itself does not issue a storage request."
  Ga04e2681e8:
    hides_flow: "no"
    citation:
    note: "WTForms StringField constructs local form-field metadata for rendering/validation. Names/descriptions are displayed in the application’s own form, with no logging or third-party transmission."
  Gded8ee57b6:
    hides_flow: "no"
    citation:
    note: "Pillow textbbox calculates local text dimensions for image layout and returns numeric bounds. It does not send or log the names; the generated image is an application response."
