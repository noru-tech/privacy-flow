    note: "Prisma user.delete deletes the matching database row. The user UID is a database predicate, and this database operation is not a listed outbound sink."
  Gde6b09dcfc:
    hides_flow: "no"
    citation:
    note: "E.right is a pure tagged success wrapper. At the listed sites it returns token/invitation/team results to service callers and own API responses. It does not itself send, log or persist data externally; invitation sending shown elsewhere occurs before these return wrappers."
  Gf1fb165a20:
    hides_flow: "no"
    citation:
    note: "graphql-subscriptions PubSub publishes via an in-process EventEmitter. Subscribers supply the application’s own GraphQL subscription responses, which the guide excludes; this is not third-party messaging or HTTP."
  Gb15f302f90:
    hides_flow: "no"
    citation:
    note: "Prisma createMany inserts infrastructure configuration records into the application database. Database writes are not counted sinks, and no hidden external transmission occurs in this method."
  G9de8868a20:
    hides_flow: "no"
    citation:
    note: "Prisma findUnique retrieves a document for the application’s public document response. Subsequent auto-sync reads local collections/environments; neither database reads nor own responses are counted sinks."
  G5fef956159:
    hides_flow: "no"
    citation:
    note: "isLeft inspects the Either tag and returns a boolean; it does not propagate the contained personal payload into an external action. These controller/resolver branches produce own API errors or results."
  G3149d68a92:
    hides_flow: "no"
    citation:
    note: "Prisma update stores the saved request record in the database; saving an HTTP request definition does not execute that request. Subsequent own API/PubSub responses are excluded."
  G42629e4c15:
    hides_flow: "no"
    citation:
    note: "Prisma findMany performs local database queries for child collection records. Collection IDs are predicates; returned saved request definitions are not executed by this query or exported to a listed sink."
  G8f2328f2e7:
    hides_flow: "no"
    citation:
    note: "This verify callback returns validated state/context to Passport for OAuth/OIDC completion. App state is used for the own redirect response and OIDC context for token validation. Although the helper supports a PKCE verifier, no backend strategy enabling that branch was found; no demonstrated personal payload from this callback enters an outbound sink."
