    note: "Django mail_admins delivers email to the configured ADMINS recipients, exposing their email addresses to the mail transport. The message body itself is only an aggregate log count and admin-page link."
  S41084e83f6:
    is_sink: "no"
    personal:
    categories: []
    source:
