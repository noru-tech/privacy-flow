# Labels for healthchecks, imported from the labelling app. See benchmark/PROTOCOL.md §3.
items:
  Fe0bd1adc88:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "hc/accounts/forms.py:100"
    note: "cleaned_data.get is a Python dictionary lookup, not hc.lib.curl.get. The email value does not follow this false method-name match into an HTTP URL."
  Feccd116b13:
    verdict: "tp"
    category_ok: "yes"
    citation: "hc/integrations/signal/transport.py:101"
    note: "The channel phone number is passed as recipient to send and interpolated directly into the logged Signal failure message."
  Fc20bc833e1:
    verdict: "fp_not_personal"
    category_ok:
    citation: "hc/lib/s3.py:95"
    note: "The claimed source expression is the exception class name, an implementation/type identifier rather than personal data. Any exception details included by logger.exception would be a separate source."
  Fc6c7c77afe:
    verdict: "fp_path"
    category_ok: "no"
    citation: "hc/accounts/views.py:610"
    note: "Django form.is_valid performs validation, not logging. The displayed source is a rendered change-email form/context, not a password, and the later render result does not flow backward into validation."
  Fc9c7ac9554:
    verdict: "fp_path"
    category_ok: "no"
    citation: "hc/accounts/views.py:350"
    note: "form.is_valid is validation, not a log sink. The source is a project name assigned after validation, not an email address, and cannot propagate backward into this earlier call."
  F927047a33d:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "hc/api/models.py:569"
    note: "remote_addr is stored in the Ping database row. The S3 call receives check code, ping sequence number and request body, not remote_addr; proximity after ping.save does not propagate the IP into those arguments."
  F484bfb24dc:
    verdict: "tp"
    category_ok: "yes"
    citation: "hc/lib/curl.py:152"
    note: "The username/password auth tuple is directly supplied to pycurl USERPWD for HTTP authentication."
  Fd46fb27f3e:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "hc/accounts/forms.py:101"
    note: "cleaned_data.get reads a password from a dictionary; it does not invoke the unrelated curl.get HTTP wrapper. This false dispatch edge cannot put the password into the request URL."
  Fa4c292e7d6:
    verdict: "tp"
    category_ok: "no"
    citation: "hc/lib/s3.py:109"
    note: "The loaded Check object supplies self.code to put_object, where it forms the S3 key. The check UUID is the secret ping-endpoint identifier and reaches S3, but this path does not transmit a contact email; user.authorization.credentials is more appropriate."
  Fed76dc8936:
    verdict: "fp_not_personal"
    category_ok:
    citation: "hc/front/management/commands/render_docs.py:37"
    note: "src_path.name is a repository documentation Markdown filename used by the docs renderer, not a person’s name or an uploaded user file."
  Ff83558e831:
    verdict: "fp_path"
    category_ok: "no"
    citation: "hc/accounts/views.py:335"
    note: "form.is_valid validates the timezone form and is not logging. The assigned source is a timezone preference, not email, and occurs after the claimed sink."
  Fd7b7223bad:
    verdict: "tp"
    category_ok: "yes"
    citation: "hc/lib/curl.py:152"
    note: "The auth tuple is formatted into username:password and supplied directly to curl’s HTTP authentication option."
  F6079aba359:
    verdict: "fp_path"
    category_ok: "no"
    citation: "hc/accounts/views.py:335"
    note: "The source is a timezone value, not a password. form.is_valid is validation rather than logging, and precedes the assignment shown as source."
  Fcc7c25159d:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "hc/accounts/forms.py:101"
    note: "The .get call is a dictionary lookup on cleaned_data, not the curl GET wrapper. There is no propagation from this password read to the displayed HTTP URL."
  F7d882baf02:
    verdict: "fp_path"
    category_ok: "no"
    citation: "hc/accounts/views.py:224"
    note: "Signup form validation is not a log sink. The source is a form context assigned in the invalid branch after validation, not a password propagated into the earlier call."
  F7bfc09c413:
    verdict: "tp"
    category_ok: "yes"
    citation: "hc/integrations/signal/transport.py:101"
    note: "The channel phone number is send’s recipient argument and is interpolated directly into the Signal error log."
  F3a3e7403a5:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "hc/accounts/forms.py:100"
    note: "Dictionary cleaned_data.get is incorrectly resolved to the unrelated curl.get function. The email source does not enter this outbound URL path."
  F24b245fd78:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "hc/accounts/views.py:168"
    note: "PasswordLoginForm may contain email, but is_valid is validation/authentication rather than logging. The later template context assignment does not cause a backward flow into a log sink."
  Fc71a8a55ce:
    verdict: "fp_path"
    category_ok: "no"
    citation: "hc/accounts/views.py:731"
    note: "is_valid is form validation, not logging. The source is a WebAuthn credential label named name, not an email, and is read only after validation succeeds."
  F7b3c8281f2:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "hc/accounts/views.py:583"
    note: "The password is personal, but form.is_valid validates input and is not a log sink. The cleaned password assignment occurs after that validation."
  G43d0154397:
    hides_flow: "yes"
    citation: "static/js/webauthn-json.browser-global.js:207"
    note: "The entity retains email as both name and display_name in registration options. Those options pass to navigator.credentials.create in the browser WebAuthn helper, supplying personal account labels to the browser/authenticator credential-creation boundary; randomizing id does not remove email."
  Gb8d169b4a1:
    hides_flow: "no"
    citation:
    note: "Django ORM filter uses the API-key prefix to select candidate projects from the database, then compares keys locally. This lookup does not send the credential to a qualifying sink."
  Gd5eaaab0b6:
    hides_flow: "no"
    citation:
    note: "Fido2Server.register_complete verifies the authenticator registration response locally and returns credential data for database persistence. It does not contact a third party or log/transmit the supplied response."
  Gd8fc502392:
    hides_flow: "no"
    citation:
    note: "OnCalendar parses a schedule and computes local next-run datetimes. The displayed uses validate it or render dates in the app response; no qualifying sink is reached through the iterator."
  G8e891abbb6:
    hides_flow: "yes"
    citation: "hc/lib/curl.py:185"
    note: "Transport.post delegates to the HTTP curl wrapper. Integration calls transmit configured credentials/webhook tokens, phone-call recipients and user-authored monitoring alert payloads to external providers."
  Gcbd836ccb3:
    hides_flow: "yes"
    citation: "hc/integrations/signal/transport.py:101"
    note: "PhoneConf validation returns the phone recipient unchanged; Signal.notify passes channel.phone.value to send, whose failure log includes the recipient. Validation is an intermediate transformation, not the endpoint."
  Gb2051b0a72:
    hides_flow: "no"
    citation:
    note: "Fido2Server.authenticate_complete locally validates the assertion against the stored credential and challenge; this call returns a success boolean and does not send the response or credentials to a service or log."
  Ga55ed16e10:
    hides_flow: "no"
    citation:
    note: "set.issubset performs a local set comparison and returns only a boolean; no input tag strings are transmitted or logged by this call."
  Ga062e2acfa:
    hides_flow: "no"
    citation:
    note: "provisioning_uri constructs an otpauth URI locally. Segno locally renders it as a data-URI QR code for the own-app response; neither is an outbound request, external QR service, log, or browser-storage write."
  G5dfc6813dd:
    hides_flow: "yes"
    citation: "static/js/webauthn-json.browser-global.js:207"
    note: "register_begin produces creation options with name/display_name set to email; the registration page forwards these options through createRequestFromJSON to navigator.credentials.create, storing the account credential with the browser/authenticator."
