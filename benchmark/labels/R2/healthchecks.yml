    categories: ["user.contact.email", "user.credentials"]
    source: "hc/api/models.py:1087"
    note: "The email contains the Signal CAPTCHA challenge token and raw response and is sent to configured ADMINS email recipients; both the token and recipient addresses reach the mail transport."
  S4f759778a1:
    is_sink: "yes"
    personal: "yes"
    categories: ["user"]
    source: "hc/integrations/signal/transport.py:179"
    note: "Polymorphic notify dispatch reaches configured delivery transports such as Signal.send, which sends channel.phone.value and user-authored check content to Signal. Other transports likewise send emails or external HTTP notifications."
