# Labels for ctfd, imported from the labelling app. See benchmark/PROTOCOL.md §3.
items:
  F53e74a8b69:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The account name is passed as a formatting argument to log, merged into props, and emitted by logger.info in the submission record."
  F0032111aae:
    verdict: "fp_path"
    category_ok: "no"
    citation: "CTFd/auth.py:104"
    note: "The source email used later in the confirmation template does not flow backward into the preceding log, which formats user.name and IP. The source is contact email, not public user content."
  F95c14a86d9:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The request form includes the submitted challenge answer, which is placed into the TOO FAST submission log with account identity. The form-to-log dataflow preserves user content."
  Fb10ce1a94d:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/utils/updates/__init__.py:52"
    note: "Users.query.count returns an aggregate count and does not read password values. The final check[\"resource\"].get is also a local JSON dictionary lookup, not outbound HTTP."
  Ff52bb2ffdf:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/utils/updates/__init__.py:50"
    note: "Challenges.query.count sends only the number of challenges, not the related user ratings or their public content. Counting rows does not serialize the ratings relationship."
  F886fee9d53:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The account name is included as name in the TOO FAST log template and emitted by the shared logger."
  F485c2b45b8:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The known account name is formatted into the invalid-password audit message and written by logger.info."
  Fb2b8574bc2:
    verdict: "fp_path"
    category_ok: "no"
    citation: "CTFd/auth.py:486"
    note: "The source read at500 occurs in the invalid-password branch, while486 logs a successful login in the mutually exclusive branch. This source occurrence cannot reach that earlier sink. The value is an account name, not public-content text."
  Ff47b580425:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/utils/updates/__init__.py:53"
    note: "Teams.query.count returns the number of teams, not their email column values. Only the aggregate count reaches the version-check request."
  Fce902e2dda:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The account name is directly included in the successful password-reset audit log through props formatting."
  Fba5e838dff:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/utils/updates/__init__.py:52"
    note: "Users.query.count produces a total, not individual language values. The final dictionary .get is also not an outbound request sink."
  F01f818e44b:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "get_ip returns the request remote address and the log helper interpolates it into templates containing {ip}, including login and registration logs."
  Fbba516b125:
    verdict: "tp"
    category_ok: "no"
    citation: "CTFd/utils/email/providers/mailgun.py:26"
    note: "When key is mailfrom_addr, the configured sender email is formatted and sent to Mailgun in the from field. The flow is real, but the value is contact email rather than public-content text."
  F1d65cfbc89:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/utils/updates/__init__.py:52"
    note: "The source is only the aggregate number of users, not user content or identities. Additionally, the final .get is a local JSON lookup rather than an HTTP sink."
  Fa292c9d451:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/api/v1/challenges.py:860"
    note: "Loading the User row does not propagate its language field into name, account_id, challenge_id, or kpm. The TOO FAST log receives those fields and submission, not user.language."
  F9c323cc019:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The user account name is explicitly passed into the PARTIAL submission log template and emitted by logger.info."
  F9a3a75514c:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/auth.py:500"
    note: "The log argument is user.name, not user.email. Distinct ORM columns do not flow into each other merely because both belong to the same loaded User row."
  Fd380aa2b5d:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The request remote address is returned by get_ip and interpolated into audit templates containing {ip}, then logged."
  F28096e54b5:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/utils/exports/__init__.py:304"
    note: "Callers pass import phase strings, database-table archive member names, plugin names, and progress counts. They do not print imported row values or user identities through this status value."
  F5b0334ebb4:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/auth.py:573"
    note: "The request authorization code is inserted into the token-exchange form and sent with client credentials in the outbound POST."
  F7baa37368c:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/api/v1/challenges.py:886"
    note: "account_id and challenge_id are independent filter arguments. The account ID is not copied into challenge_id; the PARTIAL log uses user.name, submission, challenge_id, and kpm, not this account_id value."
  F78fcf563b7:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/utils/updates/__init__.py:52"
    note: "Counting Users does not evaluate or serialize each account_id property. Only the aggregate count enters the version-check request."
  F7ca754c02f:
    verdict: "fp_path"
    category_ok: "no"
    citation: "CTFd/auth.py:179"
    note: "The forgot-password email source at221 does not flow backward into the reset-completion log at176, and that log reads user.name rather than email. The source is contact email, not public-content text."
  F06faa956f6:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/utils/updates/__init__.py:49"
    note: "dialect.name is the database-engine type, such as mysql or sqlite. It is operational software metadata and contains no person-identifying value."
  F0c72c0af57:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "For username login, the submitted name selects the matching User.name and the same identifying name is emitted in the successful-login record. The email-login branch resolves to the linked account name."
  F577ddc3ef6:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "CTFd/auth.py:179"
    note: "The reset-completion log reads user.name, not user.email. The later forgot-password call does not route email backward into the other branch or convert email into name."
  F39be92769f:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/auth.py:579"
    note: "In this path, the config value is the OAuth API endpoint URL, an infrastructure setting. The personal access token comes from a separate source and does not make the endpoint itself personal."
  F7346fc45ad:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The new user email is passed explicitly into the registration log template and emitted by logger.info."
  F0b4a536038:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/utils/config/__init__.py:12"
    note: "The specific config value is the CTF event/site name, used with a timestamp to name the export file. This identifies the event, not a participant or personal account."
  F88276d5e71:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/auth.py:558"
    note: "The source value used on this path is the OAuth token endpoint URL, an infrastructure configuration. The authorization code and client secret in the POST body are separate sources."
  F770a46096a:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The request route IP selected after trusted-proxy filtering is returned and interpolated into {ip} audit log templates."
  F8d35e51469:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The selected untrusted/client IP from the request route is returned by get_ip and logged in audit templates containing {ip}; the IP-address category is correct."
  F0bda6b13f1:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/utils/logging/__init__.py:19"
    note: "The JSON request includes submission content. The TOO FAST branch reads that content from request_data and logs it with account identity through the shared formatting helper."
  F6c8632dd8d:
    verdict: "tp"
    category_ok: "yes"
    citation: "CTFd/cli/__init__.py:37"
    note: "The CLI accepts an arbitrary configuration key and prints its stored value. Public site-description/content settings can contain personal user-authored text; email and credential configuration values are also printable through this same path."
  F63fab98302:
    verdict: "fp_not_personal"
    category_ok:
    citation: "CTFd/auth.py:579"
    note: "The selected config is the OAuth API endpoint, an infrastructure URL rather than public personal content. Token/user data involved in the request are separate sources."
  G2759212b6a:
    hides_flow: "no"
    citation:
    note: "csv.writer.writerow serializes rows into the generated CSV export for send_file, an own-app download response. It does not itself log, contact an external service, or write browser storage."
  G0687171104:
    hides_flow: "yes"
    citation: "CTFd/utils/uploads/uploaders.py:228"
    note: "With the S3 uploader, delete forwards f.location as the object Key to boto3 delete_object. Stored uploaded filenames can retain personal identifying names despite filename sanitization, and the key reaches the external object-storage service."
  G9aecfc4d2b:
    hides_flow: "no"
    citation:
    note: "builtins.all only evaluates truthiness of prerequisite IDs and returns a boolean for validation. It does not transmit or log the input values; the error is a fixed validation message."
  Gbc8cb3fa19:
    hides_flow: "yes"
    citation: "CTFd/utils/uploads/uploaders.py:271"
    note: "When S3 storage is selected, uploader.open passes the configured logo filename as the object key to download_file. The original uploaded filename can contain identifying content and is transmitted in the object-storage request."
  Gf2386e0f55:
    hides_flow: "no"
    citation:
    note: "UserSchema.load validates/deserializes the imported row into a User, then this function adds/commits it to the database. Errors are returned to the caller; no email, logging, or external forwarding is performed here."
  G9fc19ffc4f:
    hides_flow: "no"
    citation:
    note: "cache.add stores an expiring server-side submission lock keyed by account/challenge. This is application cache/database state, excluded as a sink; it is not browser storage or a log."
  Ga0671d3712:
    hides_flow: "yes"
    citation: "CTFd/utils/email/providers/smtp.py:63"
    note: "SMTP.send_message serializes and transmits the email to the configured mail server, including recipient/sender addresses and message content. Both shown branches perform that delivery."
  Gb8345982a1:
    hides_flow: "yes"
    citation: "CTFd/utils/uploads/uploaders.py:223"
    note: "For S3 storage, download constructs a signed object URL containing the uploaded filename/key and redirects the browser to it. Following that redirect transmits the identifying filename to the external S3 endpoint; the filesystem branch stays local."
  Ga04e2681e8:
    hides_flow: "no"
    citation:
    note: "WTForms StringField constructs a local form field with label/description/validators for own-app rendering. It does not send this metadata to an external service, log it, or persist it in browser storage."
  Gded8ee57b6:
    hides_flow: "no"
    citation:
    note: "Pillow textbbox computes local text dimensions. The surrounding renderer draws a local image and returns it via send_from_directory as an own-app response; it does not post the image or text to a social platform."
