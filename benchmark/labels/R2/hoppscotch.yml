  F0d499450eb:
    verdict: "fp_path"
    category_ok: "no"
    citation: "src/pubsub/pubsub.service.ts:21"
    note: "PubSubService constructs graphql-subscriptions LocalPubSub. asyncIterableIterator is an in-process subscription mechanism, not HTTP; resulting GraphQL responses are excluded sinks. The source is user.uid, not email."
  F20648bd815:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "src/pubsub/pubsub.service.ts:25"
    note: "The environment owner UID is personal, but LocalPubSub.publish only emits an in-process GraphQL event. It is not an outbound HTTP sink; application subscription responses are excluded by the guide."
  F6fccbc33a3:
