    note: "This is a Prisma database lookup using the published-document slug/version key. The query reads app data and does not itself forward the supplied values to a qualifying sink."
  G5fef956159:
    hides_flow: "no"
    citation:
    note: "fp-ts isLeft only checks the Either discriminant and returns a boolean. It does not forward the personal payload. The displayed consumers use it for control flow before returning their own API responses."
  G3149d68a92:
    hides_flow: "no"
    citation:
    note: "Prisma userRequest.update saves the request record to the app database. The request contents are data being persisted here, not executed as an outbound HTTP request."
  G42629e4c15:
    hides_flow: "no"
    citation:
    note: "These Prisma findMany calls use collection IDs to retrieve child collections from the app database. They are internal query operations, not outbound execution of requests or external telemetry."
  G8f2328f2e7:
    hides_flow: "yes"
    citation: "node_modules/passport-oauth2/lib/strategy.js:175"
    note: "In the supported PKCE flow, ctx is the restored code verifier. Passport OAuth2 loaded callback assigns string ok to params.code_verifier (strategy.js:172) and passes it to getOAuthAccessToken for the provider token request. Reference: github.com/jaredhanson/passport-oauth2/blob/master/lib/strategy.js."
