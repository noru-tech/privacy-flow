  G0b4b6c4f4b:
    hides_flow: "no"
    citation:
    note: "These are Prisma database updates, including encrypted configuration persistence and provider-list updates. Database writes are excluded sinks; the update boundary itself does not forward the values to an external service or log."
  Gd83a2b20a6:
    hides_flow: "no"
    citation:
    note: "prisma.user.delete uses the UID as a database deletion predicate. This is a database operation, not a log, external service, HTTP or browser-storage sink."
  Gde6b09dcfc:
    hides_flow: "unsure"
    citation:
    note: "E.right preserves its value in a success wrapper. The displayed token/admin sites return to authentication or API responses, which are not sinks. The grouped boundary covers 207 sources, and I cannot establish all downstream consumers or a specific additional sink from the displayed sites."
  Gf1fb165a20:
    hides_flow: "no"
    citation:
    note: "The actual instance is graphql-subscriptions LocalPubSub, constructed at pubsub.service.ts:17. It publishes in-process events for the application’s GraphQL subscriptions; those local events and own-app responses are excluded sinks."
  Gb15f302f90:
    hides_flow: "no"
    citation:
    note: "Prisma createMany persists infrastructure configuration rows in the database. It does not send them to a third-party SDK, HTTP endpoint, log or browser storage; database persistence is excluded."
  G9de8868a20:
