    note: "The injected fetchEvents is fetchMailgunEvents (email-analytics-service-wrapper.ts). Inputs here are polling begin/end timestamps, event-type filters, maxEvents and a batch callback; they are job configuration/cursors, not personal values. Recipient event data is fetched downstream as a separate source."
  G2a4d53a58e:
    hides_flow: "no"
