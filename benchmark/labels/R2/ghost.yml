  Fa20fd25fd5:
    verdict: "fp_path"
    category_ok: "yes"
    citation: "core/server/services/auth/passwordreset.js:154"
    note: "updatedUser.save is the User ORM persistence method, not LinkClickRepository.save; the claimed cross-service chain and later unrelated fetch dispatch do not propagate this user ID to Tinybird."
  F6ad545ff5b:
