    note: "These replace calls return rewritten CSS/Markdown to inlineLexical, which serializes it back into the imported post data. Remote media importing happens before replacement; the replacement results themselves continue into in-process post construction/database storage, not a demonstrated outbound sink."
  G0bd0045cc5:
