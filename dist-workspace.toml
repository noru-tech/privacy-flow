[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). Regenerate CI with `dist generate`; never hand-edit release.yml
# beyond the documented least-privilege and pinning edits.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# Homebrew only: there is no shell installer, so there is no `curl | sh` to offer.
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). Linux builds are fully static musl.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
# Extra files in every archive, beside the README, changelog and licence dist adds itself.
include = ["NOTICE"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Homebrew: the formula is attached to every release as piiflow.rb and pushed to the tap below
# (the tap push needs a HOMEBREW_TAP_TOKEN repository secret with contents:write on the tap).
formula = "piiflow"
tap = "noru-tech/homebrew-tap"
# crates.io: ./publish-crate calls .github/workflows/publish-crate.yml after the release is hosted,
# with only the permissions Trusted Publishing needs.
publish-jobs = ["homebrew", "./publish-crate"]
github-custom-job-permissions = { "publish-crate" = { contents = "read", id-token = "write" } }
# Sign release artifacts with GitHub artifact attestations
github-attestations = true
# Attach a CycloneDX SBOM (privacy-flow.cdx.xml) to every release, built by cargo-cyclonedx
cargo-cyclonedx = true
# On pull requests only run `dist plan`, never a full build
pr-run-mode = "plan"
# release.yml is generated by `dist generate`, then its actions are pinned to commit SHAs like
# ci.yml (Dependabot keeps the pins current). Let dist tolerate that edit.
allow-dirty = ["ci"]

[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
